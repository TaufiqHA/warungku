name: warungku
description: "Aplikasi Manajemen Warung & Point of Sale (POS) Cross-Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing & Navigation
  go_router: ^14.0.0

  # Networking & Serialization
  dio: ^5.4.1
  json_annotation: ^4.8.1

  # Local & Secure Storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Thermal Printer (Bluetooth ESC/POS & Network)
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.1

  # PDF & Document Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  excel: ^4.0.3
  open_filex: ^4.4.0
  path_provider: ^2.1.2

  # UI Components & Styling
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
